name: Bug report
description: Something does not work as documented
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for the report. Please fill in the versions and the steps — without them we usually cannot reproduce the problem.
  - type: input
    id: package-version
    attributes:
      label: Package version
      description: "`com.sharq-it.sus.core` version, from the Package Manager or Packages/manifest.json"
      placeholder: "1.3.10"
    validations:
      required: true
  - type: input
    id: unity-version
    attributes:
      label: Unity version
      placeholder: "6000.3.17f1"
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where does it happen?
      multiple: true
      options:
        - Editor
        - Play Mode in the Editor
        - Desktop player
        - WebGL player
        - Mobile player
        - Other
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you saw, with the Console errors and their stack traces.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The smaller the better — a minimal .sharq component or a few lines of code that show the problem.
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Screenshots, other packages in the project, render pipeline.
